<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Village | Typixel Onam Fest 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Sans+Malayalam:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/village.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-dark text-cream overflow-hidden">

    <!-- Village Map Engine -->
    <div id="map-container">
        <div id="village-world">
            <!-- Background Terrain -->
            <div class="terrain-paddy"></div>
            <div class="terrain-river"></div>
            <div class="terrain-road"></div>
            
            <!-- Community Pookalam Center -->
            <div class="community-pookalam" style="left: 1800px; top: 1800px;">
                <div class="community-progress">
                    <h3>COMMUNITY POOKALAM</h3>
                    <p>12,482 / 15,000 flowers</p>
                    <div class="progress-bar"><div class="progress-fill" style="width: 83%;"></div></div>
                </div>
            </div>

            <!-- Cultural Locations -->
            <div class="culture-object" data-culture="kathakali" style="left: 1200px; top: 1000px;">
                <img src="assets/images/culture/kathakali.webp" alt="Kathakali performance" onerror="this.style.display='none'">
                <div class="culture-label">
                    <span class="malayalam">കഥകളി</span>
                    <strong>Kathakali</strong>
                </div>
            </div>

            <div class="culture-object" data-culture="pulikali" style="left: 2600px; top: 1200px;">
                <img src="assets/images/culture/pulikali.webp" alt="Pulikali performance" onerror="this.style.display='none'">
                <div class="culture-label">
                    <span class="malayalam">പുലിക്കളി</span>
                    <strong>Pulikali</strong>
                </div>
            </div>

            <div class="culture-object" data-culture="vallamkali" style="left: 800px; top: 2200px;">
                <img src="assets/images/vallam/snake-boat-race.webp" alt="Snake boat race" onerror="this.style.display='none'">
                <div class="culture-label">
                    <span class="malayalam">വള്ളംകളി</span>
                    <strong>Vallamkali</strong>
                </div>
            </div>

            <div class="culture-object" data-culture="sadya" style="left: 2400px; top: 2400px;">
                <img src="assets/images/sadya/onam-sadya.webp" alt="Onam Sadya feast" onerror="this.style.display='none'">
                <div class="culture-label">
                    <span class="malayalam">ഓണസദ്യ</span>
                    <strong>Onasadya</strong>
                </div>
            </div>

            <!-- Pookalams Layer (Managed by JS) -->
            <div id="pookalam-layer"></div>
        </div>
    </div>

    <!-- Map Controls -->
    <div class="map-controls">
        <button id="zoom-in" aria-label="Zoom In">+</button>
        <button id="zoom-out" aria-label="Zoom Out">-</button>
        <button id="reset-camera" aria-label="Reset Camera">⌂</button>
    </div>

    <!-- Live Feed -->
    <div class="live-feed">
        <h3>LIVE FROM THE VILLAGE</h3>
        <ul id="feed-list"></ul>
    </div>

    <!-- Culture Modal -->
    <div id="culture-modal" class="modal-overlay hidden">
        <div class="modal-content culture-modal-content">
            <div class="modal-image-container">
                <img id="modal-img" src="" alt="">
            </div>
            <div class="modal-info">
                <span class="modal-category">KERALA CULTURE</span>
                <h2 id="modal-title"></h2>
                <p id="modal-malayalam"></p>
                <p id="modal-desc"></p>
                <div class="did-you-know">
                    <strong>DID YOU KNOW?</strong>
                    <p id="modal-fact"></p>
                </div>
                <button class="btn-primary" id="close-modal">CLOSE</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/map-engine.js"></script>
    <script src="js/village.js"></script>
    <script src="js/culture.js"></script>
</body>
</html>
