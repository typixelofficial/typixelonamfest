<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Village | Typixel Onam Fest 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/global.css">
</head>
<body class="bg-deep-green overflow-hidden">

    <!-- The Zoomable Village Map -->
    <div id="map-container" class="fixed inset-0 cursor-grab active:cursor-grabbing">
        <div id="village-world" class="absolute origin-top-left" style="width: 4000px; height: 4000px; left: 0; top: 0;">
            
            <!-- Background Layers (Illustrative representations) -->
            <div class="absolute inset-0 bg-gradient-to-b from-paddy-light to-paddy-dark"></div>
            
            <!-- River -->
            <div class="absolute top-[800px] left-0 w-full h-[400px] bg-river-blue opacity-70 transform -rotate-5"></div>
            
            <!-- Roads -->
            <div class="absolute top-[1200px] left-0 w-full h-[60px] bg-dirt-road"></div>
            <div class="absolute top-0 left-[1500px] w-[60px] h-full bg-dirt-road"></div>

            <!-- Cultural Elements (Click targets) -->
            <div class="culture-object absolute top-[600px] left-[800px]" data-culture="chenda">🥁</div>
            <div class="culture-object absolute top-[1400px] left-[2000px]" data-culture="kathakali">🎭</div>
            <div class="culture-object absolute top-[900px] left-[3200px]" data-culture="vallam">🛶</div>
            <div class="culture-object absolute top-[2400px] left-[1200px]" data-culture="sadya">🍃</div>

            <!-- Pookalams will be rendered here by JS -->
            <div id="pookalam-layer" class="absolute inset-0 pointer-events-none"></div>
            
            <!-- Community Giant Pookalam Center -->
            <div class="absolute top-[1800px] left-[1800px] w-[400px] h-[400px] rounded-full bg-kasavu-gold/30 flex items-center justify-center border-4 border-kasavu-gold/50">
                <div class="text-center text-cream">
                    <p class="font-malayalam text-xl">സമൂഹ പൂക്കളം</p>
                    <p class="font-display text-3xl font-bold">Community Pookalam</p>
                    <p class="mt-2 text-sm">12,482 / 15,000</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating UI: Live Feed -->
    <div class="fixed top-6 left-6 z-30 bg-black/40 text-cream p-4 rounded-xl backdrop-blur-sm max-w-xs hidden md:block">
        <h3 class="font-bold text-kasavu-gold mb-2 border-b border-kasavu-gold/30 pb-1">LIVE FROM THE VILLAGE</h3>
        <ul id="live-feed" class="space-y-2 text-sm font-body"></ul>
    </div>

    <!-- Floating UI: Discoveries -->
    <div class="fixed top-6 right-6 z-30 bg-black/40 text-cream p-4 rounded-xl backdrop-blur-sm hidden md:block">
        <h3 class="font-bold text-kasavu-gold mb-2">KERALA CULTURE</h3>
        <div id="discovery-list" class="text-sm space-y-1 font-body"></div>
    </div>

    <!-- Map Controls -->
    <div class="fixed bottom-6 right-6 z-30 flex flex-col gap-2">
        <button id="zoom-in" class="bg-cream text-deep-green w-12 h-12 rounded-full text-xl font-bold shadow-lg">+</button>
        <button id="zoom-out" class="bg-cream text-deep-green w-12 h-12 rounded-full text-xl font-bold shadow-lg">−</button>
        <button id="go-home" class="bg-cream text-deep-green w-12 h-12 rounded-full text-xl font-bold shadow-lg">⌂</button>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 z-30 bg-deep-green/90 text-cream flex justify-around py-3 md:hidden backdrop-blur-sm">
        <a href="village.html" class="flex flex-col items-center text-kasavu-gold">🏠 <span class="text-xs">Village</span></a>
        <a href="pookalam.html" class="flex flex-col items-center">🌼 <span class="text-xs">Pookalam</span></a>
        <a href="#" class="flex flex-col items-center">🎮 <span class="text-xs">Programs</span></a>
        <a href="#" class="flex flex-col items-center">🏆 <span class="text-xs">Rank</span></a>
    </nav>

    <!-- Culture Modal -->
    <div id="culture-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-cream max-w-2xl w-full rounded-3xl overflow-hidden shadow-2xl relative">
            <div id="modal-image" class="h-64 bg-deep-green flex items-center justify-center text-9xl"></div>
            <div class="p-8">
                <h2 id="modal-title" class="font-display text-4xl font-bold mb-4 text-traditional-red"></h2>
                <p id="modal-desc" class="font-body text-gray-700 text-lg mb-8"></p>
                <div class="flex justify-between items-center">
                    <button id="close-modal" class="text-deep-green font-bold hover:underline">CLOSE</button>
                    <button class="bg-traditional-red text-cream px-6 py-3 rounded-full font-bold hover:bg-deep-red">EXPLORE</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/map-engine.js"></script>
    <script src="js/village.js"></script>
</body>
</html>
