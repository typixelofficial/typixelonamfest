<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typixel Onam Fest 2026 | Build the Village Together</title>
    <meta name="description" content="Create your Pookalam, explore Kerala culture, join Onam games and become part of a shared digital Kerala village.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Sans+Malayalam:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-cream text-dark">

    <!-- Cinematic Hero -->
    <div class="hero-container">
        <div class="hero-layer sky"></div>
        <div class="hero-layer clouds"></div>
        <div class="hero-layer mountains"></div>
        <div class="hero-layer paddy"></div>
        <div class="hero-layer trees"></div>
        <div class="hero-layer house"></div>
        <div class="hero-layer foreground-flowers"></div>
        <div class="floating-petals"></div>

        <div class="hero-content">
            <p class="hero-malayalam">ഈ ഓണം നമ്മൾ ഒരുമിച്ച് പണിയാം</p>
            <h1 class="hero-title">
                <span class="brand">TYPOXEL</span>
                <span class="event">ONAM FEST</span>
                <span class="year">2026</span>
            </h1>
            <p class="hero-subtitle">A digital Onam village built by everyone.</p>
            <button id="enter-festival-btn" class="btn-primary">ENTER THE FESTIVAL</button>
            <p class="scroll-hint">Scroll / Enter the village</p>
        </div>
    </div>

    <!-- Username Modal -->
    <div id="username-modal" class="modal-overlay hidden">
        <div class="modal-content username-card">
            <h2 class="modal-title">WELCOME TO THE VILLAGE</h2>
            <p class="modal-malayalam">നമ്മുടെ ഓണഗ്രാമത്തിലേക്ക് സ്വാഗതം</p>
            <p class="modal-subtitle">What should we call you?</p>
            
            <div class="input-group">
                <input type="text" id="username-input" placeholder="YourName" maxlength="15">
            </div>
            
            <button id="enter-village-btn" class="btn-primary">ENTER VILLAGE</button>
        </div>
    </div>

    <header class="site-header">
        <div class="logo">TYPOXEL</div>
        <nav class="main-nav">
            <a href="village.html">Village</a>
            <a href="culture.html">Culture</a>
            <a href="pookalam.html">Pookalam</a>
            <a href="sadya.html">Sadya</a>
            <a href="games.html">Games</a>
            <a href="gallery.html">Gallery</a>
        </nav>
    </header>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
