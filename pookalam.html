<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pookalam Creator | Typixel Onam Fest 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/global.css">
</head>
<body class="bg-cream min-h-screen flex flex-col">

    <header class="bg-deep-green text-cream py-4 px-6 flex justify-between items-center">
        <a href="village.html" class="text-kasavu-gold hover:underline">← Back to Village</a>
        <h1 class="font-display text-2xl font-bold">Pookalam">Pookalam Creator</h1>
        <div class="w-8"></div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row p-6 gap-8">
        <!-- Canvas Area -->
        <div class="flex-1 flex items-center justify-center bg-white rounded-3xl shadow-inner border-4 border-kasavu-gold/20 p-4">
            <svg id="pookalam-canvas" viewBox="-100 -100 200 200" class="w-full max-w-xl aspect-square"></svg>
        </div>

        <!-- Tool Panel -->
        <aside class="w-full md:w-80 bg-white rounded-3xl shadow-xl p-6 flex flex-col">
            <h2 class="font-display text-xl font-bold mb-4 text-traditional-red">Flower Palette</h2>
            <div id="color-palette" class="grid grid-cols-5 gap-2 mb-6"></div>
            
            <h2 class="font-display text-xl font-bold mb-4 text-traditional-red">Rings</h2>
            <div class="flex gap-2 mb-6">
                <button class="ring-btn flex-1 bg-gray-200 py-2 rounded-lg hover:bg-gray-300" data-ring="add">Add Ring</button>
                <button class="ring-btn flex-1 bg-gray-200 py-2 rounded-lg hover:bg-gray-300" data-ring="remove">Remove Ring</button>
            </div>

            <div class="mt-auto space-y-4">
                <input type="text" id="pookalam-title" placeholder="Name your Pookalam" class="w-full border-2 border-gray-300 p-3 rounded-lg focus:outline-none focus:border-kasavu-gold">
                
                <button id="publish-btn" class="w-full bg-traditional-red text-cream py-4 rounded-xl font-bold text-lg hover:bg-deep-red transition-transform hover:scale-105 shadow-lg">
                    PUBLISH TO THE VILLAGE 🌼
                </button>
            </div>
        </aside>
    </main>

    <!-- Publish Animation Overlay -->
    <div id="publish-overlay" class="fixed inset-0 z-50 bg-deep-green/95 hidden flex-col items-center justify-center text-cream">
        <h2 class="font-display text-4xl mb-8 animate-pulse">Your Pookalam is joining the village...</h2>
        <div class="text-9xl mb-8 animate-bounce">🌼</div>
        <p class="text-kasavu-gold text-xl" id="publish-status">Finding a home...</p>
    </div>

    <script src="js/data.js"></script>
    <script src="js/pookalam.js"></script>
</body>
</html>
