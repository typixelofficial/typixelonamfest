<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pookalam Creator | Typixel Onam Fest 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Sans+Malayalam:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pookalam.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-cream">

    <header class="site-header solid">
        <div class="logo">TYPOXEL</div>
        <a href="village.html" class="btn-secondary">Back to Village</a>
    </header>

    <main class="creator-layout">
        <div class="canvas-area">
            <svg id="pookalam-canvas" viewBox="-100 -100 200 200"></svg>
        </div>

        <aside class="controls-panel">
            <h2>CREATE YOUR POOKALAM</h2>
            
            <div class="control-group">
                <label>Flower Palette</label>
                <div id="color-palette" class="palette-grid"></div>
            </div>

            <div class="control-group">
                <label>Rings</label>
                <div class="btn-row">
                    <button class="btn-secondary" id="add-ring">+ Add Ring</button>
                    <button class="btn-secondary" id="remove-ring">- Remove Ring</button>
                </div>
            </div>

            <div class="control-group">
                <label>Pookalam Title</label>
                <input type="text" id="pookalam-title" placeholder="My Onam Joy">
            </div>

            <button id="publish-btn" class="btn-primary">PUBLISH TO THE VILLAGE</button>
        </aside>
    </main>

    <!-- Publish Animation -->
    <div id="publish-overlay" class="publish-overlay hidden">
        <div class="publish-content">
            <div class="pookalam-rising"></div>
            <h2>YOUR POOKALAM HAS JOINED THE VILLAGE</h2>
            <p class="modal-malayalam">നിങ്ങളുടെ പൂക്കളം ഗ്രാമത്തിലെത്തി</p>
            <a href="village.html" class="btn-primary">VIEW IN VILLAGE</a>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/pookalam.js"></script>
</body>
</html>
